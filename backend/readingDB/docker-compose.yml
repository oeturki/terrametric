# Contains all that is needed to work on the database, all that is needed is Docker.
services:
  timescaledb:
    image: timescale/timescaledb:latest-pg18
    container_name: sensor_reading_db 
    env_file: .env
    ports:
      - "6543:5432"
    volumes:
      - sensor_reading_data:/var/lib/postgresql/data
      - ./migrations:/migrations
      - ./migration.sh:/migration.sh 

volumes:
  sensor_reading_data:
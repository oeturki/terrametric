<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TerraMetric — Indoor Plant Research</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Instrument+Serif:ital@0;1&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- SIDEBAR -->
<aside class="sidebar">
  <div class="logo">
    <div class="logo-mark">Group 14</div>
    <div class="logo-title">TerraMetric</div>
    <div class="logo-sub">Indoor Research Platform v1.0</div>
  </div>
  <nav class="nav">
    <div class="nav-section">Main</div>
    <div class="nav-item active" onclick="goTo('home',this)"><span class="nav-icon">⌂</span><span>Home</span></div>
    <div class="nav-section">Monitor</div>
    <div class="nav-item" onclick="goTo('viewdata',this)"><span class="nav-icon">◈</span><span>View Data</span></div>
    <div class="nav-section">Manage</div>
    <div class="nav-item" onclick="goTo('control',this)"><span class="nav-icon">⊞</span><span>Control Variables</span></div>
    <div class="nav-item" onclick="goTo('samples',this)"><span class="nav-icon">⊙</span><span>Manage Samples</span></div>
  </nav>
  <div class="sidebar-footer">
    <span class="status-dot" id="connDot"></span>
    <span id="connLabel">CONNECTING…</span>
  </div>
</aside>

<!-- GLOBAL OVERLAYS -->
<div class="toast-stack" id="toastStack"></div>
<div class="alert-dropdown" id="alertDD">
  <div class="alert-dd-head">
    <span class="alert-dd-title">⚠ Alert Log</span>
    <span class="clear-btn" onclick="clearAlerts()">Clear all</span>
  </div>
  <div class="alert-log" id="alertLog">
    <div class="log-empty" id="logEmpty"><div style="font-size:28px;margin-bottom:8px">🔔</div>No alerts yet</div>
  </div>
</div>

<!-- PAGES — each div gets filled from pages/*.html -->
<main class="main">
  <div class="page active" id="page-home"></div>
  <div class="page"        id="page-viewdata"></div>
  <div class="page"        id="page-control"></div>
  <div class="page"        id="page-samples"></div>
</main>

<!-- JS files — your teammates' edited versions, untouched -->
<script src="js/config.js"></script>
<script src="js/alerts.js"></script>
<script src="js/charts.js"></script>
<script src="js/anomalies.js"></script>
<script src="js/home.js"></script>
<script src="js/samples.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>

<!-- PAGE LOADER — fetches each page file and injects it, then fires 'pages-loaded' for app.js -->
<script>
  const PAGES = [
    { id: 'page-home',     src: 'pages/page-home.html'     },
    { id: 'page-viewdata', src: 'pages/page-viewdata.html' },
    { id: 'page-control',  src: 'pages/page-control.html'  },
    { id: 'page-samples',  src: 'pages/page-samples.html'  },
  ];

  Promise.all(PAGES.map(p =>
    fetch(p.src)
      .then(r => r.text())
      .then(html => { document.getElementById(p.id).innerHTML = html; })
      .catch(() => { document.getElementById(p.id).innerHTML = '<div style="padding:40px;color:red">Failed to load ' + p.src + '</div>'; })
  )).then(() => {
    window.dispatchEvent(new Event('pages-loaded'));
  });
</script>

</body>
</html>
